<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EU Tiers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap');
:root{
  --bg:#06060f;--surface:#0c0c1e;--card:#10102a;--card-hover:#141432;
  --border:#1e1b3a;--accent:#7c3aed;--accent2:#a855f7;--glow:rgba(124,58,237,.35);
  --text:#ede9fe;--muted:#7c6fa0;--white:#ffffff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(124,58,237,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.04) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;}
body::after{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);
  width:800px;height:400px;background:radial-gradient(ellipse,rgba(124,58,237,.18) 0%,transparent 70%);
  pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 16px;}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(6,6,15,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.header-inner{max-width:960px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.logo{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(135deg,#c084fc 0%,#7c3aed 50%,#a855f7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;filter:drop-shadow(0 0 12px rgba(168,85,247,.5));}
.logo span{-webkit-text-fill-color:var(--muted);filter:none;font-weight:500;font-size:.8rem;letter-spacing:.04em;margin-left:8px;}
.hdr-count{font-size:.78rem;color:var(--muted);}
.hdr-count b{color:var(--accent2);}

/* HERO */
.hero{padding:44px 0 28px;text-align:center;}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.4rem,8vw,4.2rem);font-weight:700;line-height:1;
  letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(180deg,#ffffff 0%,#c084fc 60%,#7c3aed 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;filter:drop-shadow(0 0 28px rgba(168,85,247,.4));margin-bottom:8px;}

/* CONTROLS */
.controls{padding:0 0 18px;display:flex;flex-direction:column;gap:10px;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
#search{width:100%;padding:11px 13px 11px 40px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;}
#search::placeholder{color:var(--muted);}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.15);}
.filters{display:flex;flex-wrap:wrap;gap:6px;}
.filter-btn{padding:5px 13px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--muted);
  font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap;}
.filter-btn:hover{border-color:var(--accent);color:var(--text);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 12px var(--glow);}

/* SECTION LABEL */
.section-label{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}

/* TIER BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;
  font-size:.7rem;font-weight:700;line-height:1.5;letter-spacing:.04em;white-space:nowrap;border:1px solid;}
.t-lt5{color:#555;background:rgba(50,50,50,.12);border-color:rgba(55,55,55,.2);}
.t-ht5{color:#686868;background:rgba(65,65,65,.12);border-color:rgba(65,65,65,.2);}
.t-lt4{color:#808080;background:rgba(85,85,85,.12);border-color:rgba(85,85,85,.2);}
.t-ht4{color:#9a9a9a;background:rgba(105,105,105,.12);border-color:rgba(105,105,105,.22);}
.t-lt3{color:#c07838;background:rgba(160,100,40,.13);border-color:rgba(160,100,40,.28);}
.t-ht3{color:#e8b870;background:rgba(220,160,80,.13);border-color:rgba(220,160,80,.3);}
.t-lt2{color:#c0c0d8;background:rgba(160,160,200,.12);border-color:rgba(160,160,200,.28);}
.t-ht2{color:#e8e8f8;background:rgba(220,220,240,.12);border-color:rgba(220,220,240,.3);}
.t-lt1{color:#ffd700;background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.3);}
.t-ht1{color:#fff8a0;background:rgba(255,248,120,.13);border-color:rgba(255,248,120,.38);}

/* TITLE BADGE */
.title-badge{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;
  padding:1px 8px;border-radius:20px;border:1px solid;}

/* ── OVERALL LEADERBOARD ── */
#leaderboard{display:flex;flex-direction:column;gap:4px;padding-bottom:40px;}

/* Player card */
.player-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  transition:border-color .15s;}
.player-card:hover{border-color:#2e2a50;}
.player-card[data-rank="1"]{border-color:rgba(255,248,120,.4);box-shadow:inset 0 0 20px rgba(255,248,120,.04);}
.player-card[data-rank="2"]{border-color:rgba(220,220,240,.3);}
.player-card[data-rank="3"]{border-color:rgba(220,160,80,.3);}

/* Card header (clickable) */
.card-header{display:grid;grid-template-columns:44px auto 1fr auto;align-items:center;gap:12px;
  padding:11px 16px;cursor:pointer;user-select:none;}
.card-header:hover .card-chevron{color:var(--accent2);}
.rank{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;text-align:center;line-height:1;}
[data-rank="1"] .rank{color:#fff8a0;text-shadow:0 0 10px rgba(255,248,100,.6);}
[data-rank="2"] .rank{color:#e8e8f8;}
[data-rank="3"] .rank{color:#e8b870;}
.rank-default{color:var(--muted);}

/* MC skin avatar in card */
.mc-avatar{width:32px;height:32px;border-radius:5px;image-rendering:pixelated;flex-shrink:0;}
.mc-avatar-placeholder{width:32px;height:32px;border-radius:5px;background:var(--border);flex-shrink:0;}

.player-info{min-width:0;}
.player-ign{font-weight:700;font-size:.93rem;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.player-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.kit-badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;}
.score-wrap{text-align:right;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.score-val{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;color:var(--accent2);line-height:1;}
.score-label{font-size:.65rem;color:var(--muted);margin-top:2px;}
.card-chevron{color:var(--muted);font-size:.8rem;transition:transform .2s;flex-shrink:0;}
.player-card.expanded .card-chevron{transform:rotate(180deg);}

/* Expanded details */
.card-details{display:none;border-top:1px solid var(--border);padding:16px;}
.player-card.expanded .card-details{display:block;}
.details-inner{display:flex;gap:16px;align-items:flex-start;}
.mc-body-wrap{flex-shrink:0;text-align:center;}
.mc-body{width:60px;image-rendering:pixelated;border-radius:6px;}
.mc-body-label{font-size:.65rem;color:var(--muted);margin-top:4px;}
.kit-detail-grid{display:flex;flex-direction:column;gap:6px;flex:1;}
.kit-detail-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:5px 10px;background:var(--surface);border-radius:7px;border:1px solid var(--border);}
.kit-detail-left{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text);}
.kit-detail-pts{font-size:.72rem;color:var(--muted);white-space:nowrap;}
.details-summary{margin-top:10px;padding:8px 12px;background:var(--surface);border-radius:8px;
  border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.details-summary-pts{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;color:var(--accent2);}

/* COLUMN VIEW */
.col-wrap{overflow-x:auto;padding-bottom:40px;}
.tier-columns{display:flex;gap:8px;min-width:max-content;}
.tier-col{min-width:120px;flex-shrink:0;}
.tier-col-hdr{padding:6px 10px;border-radius:7px 7px 0 0;font-size:.78rem;font-weight:700;
  text-align:center;border:1px solid;border-bottom:none;letter-spacing:.04em;}
.tier-col-body{display:flex;flex-direction:column;gap:3px;border:1px solid var(--border);
  border-radius:0 0 7px 7px;padding:6px;background:var(--card);min-height:60px;}
.col-player{padding:4px 8px;border-radius:5px;font-size:.78rem;font-weight:500;
  background:var(--surface);border:1px solid var(--border);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--text);}

/* SEARCH / PROFILE */
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:20px;margin-bottom:12px;}
.profile-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
.profile-skin{flex-shrink:0;}
.profile-body-img{width:70px;image-rendering:pixelated;border-radius:8px;}
.profile-info{flex:1;min-width:0;}
.profile-ign{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:var(--white);margin-bottom:5px;}
.profile-right{text-align:right;}
.profile-pts{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;color:var(--accent2);}
.profile-pts-label{font-size:.65rem;color:var(--muted);}
.profile-kits{display:flex;flex-direction:column;gap:6px;}
.profile-kit-row{display:flex;align-items:center;justify-content:space-between;
  padding:5px 10px;background:var(--surface);border-radius:7px;border:1px solid var(--border);}
.profile-kit-left{display:flex;align-items:center;gap:6px;font-size:.82rem;}
.profile-kit-pts{font-size:.7rem;color:var(--muted);}

/* MISC */
.empty{text-align:center;padding:60px 0;color:var(--muted);font-size:.88rem;}
.empty b{display:block;font-size:1rem;color:var(--text);margin-bottom:6px;}
.loading{text-align:center;padding:80px 0;}
.spinner{width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:14px 18px;color:#fca5a5;font-size:.83rem;margin-bottom:14px;}
.error-box b{display:block;margin-bottom:4px;}
footer{border-top:1px solid var(--border);padding:18px 0;text-align:center;color:var(--muted);font-size:.73rem;}
footer span{color:var(--accent2);}
@media(max-width:520px){.card-header{grid-template-columns:36px auto 1fr auto;padding:9px 10px;}.hero-title{letter-spacing:.02em;}.details-inner{flex-direction:column;}.mc-body-wrap{display:flex;align-items:center;gap:10px;}.mc-body{width:50px;}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">EU Tiers <span>Leaderboard</span></div>
    <div class="hdr-count" id="hdr-count"></div>
  </div>
</header>
<div class="wrap">
  <div class="hero">
    <div class="hero-title">EU&nbsp;Tiers</div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Search player...">
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="section-label" id="section-label">Overall ranking — Top 50</div>
  <div id="content">
    <div class="loading"><div class="spinner"></div><div style="color:var(--muted);font-size:.83rem;">Loading players...</div></div>
  </div>
</div>
<footer><div class="wrap">EU Tiers &nbsp;·&nbsp; Powered by <span>Discord Bot V3.3</span></div></footer>

<script>
const API_URL = 'https://raw.githubusercontent.com/crazykyoo/eu-tiers-data/main/players.json';

const TIER_SCORES={ht1:60,lt1:48,ht2:32,lt2:24,ht3:16,lt3:10,ht4:5,lt4:3,ht5:2,lt5:1};
const TIER_ORDER=['ht1','lt1','ht2','lt2','ht3','lt3','ht4','lt4','ht5','lt5'];
const KITS=['sword','axe','uhc','pot','nethop','smp','diasmp','mace','vannila'];
const KIT_LABELS={sword:'Sword',axe:'Axe',uhc:'UHC',pot:'Pot',nethop:'NetheriteOP',smp:'SMP',diasmp:'DiaSMP',mace:'Mace',vannila:'Vanilla'};
const KIT_ICONS={sword:'🗡️',axe:'🪓',uhc:'🍎',pot:'🍷',nethop:'🖤',smp:'🛡️',diasmp:'💠',mace:'🔨',vannila:'💎'};

const TIER_LABELS={ht1:'HT1',lt1:'LT1',ht2:'HT2',lt2:'LT2',ht3:'HT3',lt3:'LT3',ht4:'HT4',lt4:'LT4',ht5:'HT5',lt5:'LT5'};

function getTitle(pts){
  if(pts===0)  return{label:'Unranked',   color:'#4b5563'};
  if(pts<=39)  return{label:'Newbie',     color:'#9ca3af'};
  if(pts<=79)  return{label:'Warrior',    color:'#86efac'};
  if(pts<=139) return{label:'Expert',     color:'#60a5fa'};
  if(pts<=239) return{label:'Master',     color:'#c084fc'};
  if(pts<=319) return{label:'Grandmaster',color:'#f472b6'};
  if(pts<=479) return{label:'Challenger', color:'#fb923c'};
  if(pts<=529) return{label:'Champion',   color:'#fbbf24'};
  return           {label:'Nightmare',    color:'#ff2050'};
}

function tierBadge(tier,kitIcon){
  if(!tier)return'';
  const icon=kitIcon?`<span style="opacity:.6;font-size:.62rem;margin-right:2px;">${kitIcon}</span>`:'';
  return`<span class="badge t-${tier}">${icon}${tier.toUpperCase()}</span>`;
}
function titleBadge(pts){
  const t=getTitle(pts);
  return`<span class="title-badge" style="color:${t.color};border-color:${t.color}40;background:${t.color}12">${t.label}</span>`;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function calcScore(kits){return Object.values(kits).reduce((s,t)=>s+(TIER_SCORES[t]||0),0);}
function skinUrl(ign,type='avatar'){return`https://mc-heads.net/${type}/${encodeURIComponent(ign)}`;}

let allPlayers=[],activeKit='overall',searchVal='';

async function loadPlayers(){
  try{
    const res=await fetch(API_URL+'?t='+Date.now());
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    allPlayers=Object.entries(data)
      .filter(([,p])=>p.ign&&p.kits&&Object.keys(p.kits).length>0)
      .map(([id,p])=>{
        const normalizedKits={};
        for(const[kit,tier] of Object.entries(p.kits||{})){if(tier)normalizedKits[kit]=tier.toLowerCase();}
        return{id,ign:p.ign,kits:normalizedKits,overall:calcScore(normalizedKits)};
      })
      .filter(p=>p.overall>0);
    document.getElementById('hdr-count').innerHTML=`<b>${allPlayers.length}</b> players ranked`;
    buildFilters();render();
  }catch(e){
    document.getElementById('content').innerHTML=`<div class="error-box"><b>⚠️ Could not load player data</b>Make sure API_URL is correct.<br><small style="opacity:.7">Error: ${e.message}</small></div>`;
  }
}

function buildFilters(){
  const wrap=document.getElementById('filters');
  const tabs=[{key:'overall',label:'Overall 🏆'},...KITS.map(k=>({key:k,label:`${KIT_ICONS[k]} ${KIT_LABELS[k]}`}))];
  wrap.innerHTML=tabs.map(t=>`<button class="filter-btn${t.key===activeKit?' active':''}" data-kit="${t.key}">${t.label}</button>`).join('');
  wrap.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeKit=btn.dataset.kit;
      wrap.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('section-label').textContent=
        activeKit==='overall'?'Overall ranking — Top 50':`${KIT_LABELS[activeKit]||activeKit} — Tier Columns`;
      render();
    });
  });
}

function render(){
  if(searchVal.length>=2) renderSearch();
  else if(activeKit==='overall') renderOverall();
  else renderColumns();
}

// Build expanded detail HTML
function buildDetails(p){
  const bodyUrl=skinUrl(p.ign,'body');
  const kitsWithData=KITS.filter(k=>p.kits[k]);
  const rows=kitsWithData.map(k=>{
    const tier=p.kits[k], pts=TIER_SCORES[tier]||0;
    return`<div class="kit-detail-row">
      <div class="kit-detail-left">${KIT_ICONS[k]} <span>${KIT_LABELS[k]}</span> ${tierBadge(tier)}</div>
      <span class="kit-detail-pts">+${pts} pts</span>
    </div>`;
  }).join('');
  const t=getTitle(p.overall);
  return`<div class="details-inner">
    <div class="mc-body-wrap">
      <img class="mc-body" src="${bodyUrl}" alt="${esc(p.ign)}" onerror="this.style.display='none'">
      <div class="mc-body-label">${esc(p.ign)}</div>
    </div>
    <div style="flex:1;min-width:0;">
      <div class="kit-detail-grid">${rows||'<div style="color:var(--muted);font-size:.82rem;padding:4px 0;">No kits evaluated.</div>'}</div>
      <div class="details-summary">
        <span style="font-size:.82rem;color:var(--muted);">Total</span>
        <div style="display:flex;align-items:center;gap:8px;">
          ${titleBadge(p.overall)}
          <span class="details-summary-pts">${p.overall} pts</span>
        </div>
      </div>
    </div>
  </div>`;
}

function renderOverall(){
  const el=document.getElementById('content');
  let list=[...allPlayers].sort((a,b)=>b.overall-a.overall).slice(0,50);
  if(!list.length){el.innerHTML='<div class="empty"><b>No players</b>No ranked players yet.</div>';return;}
  el.innerHTML='<div id="leaderboard">'+list.map((p,i)=>{
    const rank=i+1;
    const rankStr=rank<=3?['🥇','🥈','🥉'][rank-1]:rank;
    const rankClass=rank<=3?'':' rank-default';
    const badges=KITS.filter(k=>p.kits[k]).map(k=>tierBadge(p.kits[k],KIT_ICONS[k])).join('');
    const avatarUrl=skinUrl(p.ign,'avatar');
    return`<div class="player-card" data-rank="${rank<=3?rank:''}" data-pid="${esc(p.id)}">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="rank${rankClass}">${rankStr}</div>
        <img class="mc-avatar" src="${avatarUrl}" alt="${esc(p.ign)}" onerror="this.outerHTML='<div class=mc-avatar-placeholder></div>'">
        <div class="player-info">
          <div class="player-ign">${esc(p.ign)}</div>
          <div class="player-meta">${titleBadge(p.overall)}</div>
          <div class="kit-badges">${badges}</div>
        </div>
        <div class="score-wrap">
          <div>
            <div class="score-val">${p.overall}</div>
            <div class="score-label">points</div>
          </div>
          <span class="card-chevron">▼</span>
        </div>
      </div>
      <div class="card-details">${buildDetails(p)}</div>
    </div>`;
  }).join('')+'</div>';
}

function toggleCard(header){
  const card=header.closest('.player-card');
  card.classList.toggle('expanded');
}

function renderColumns(){
  const el=document.getElementById('content');
  const kitPlayers=allPlayers.filter(p=>p.kits[activeKit]);
  if(!kitPlayers.length){el.innerHTML='<div class="empty"><b>No data</b>No players evaluated in this kit yet.</div>';return;}
  const colData={};TIER_ORDER.forEach(t=>{colData[t]=[];});
  kitPlayers.forEach(p=>{const t=p.kits[activeKit];if(colData[t])colData[t].push(p);});
  TIER_ORDER.forEach(t=>{colData[t].sort((a,b)=>b.overall-a.overall);});
  const HDR={
    lt5:{color:'#555',border:'rgba(55,55,55,.25)',bg:'rgba(50,50,50,.18)'},
    ht5:{color:'#686868',border:'rgba(65,65,65,.25)',bg:'rgba(65,65,65,.16)'},
    lt4:{color:'#808080',border:'rgba(85,85,85,.28)',bg:'rgba(80,80,80,.16)'},
    ht4:{color:'#9a9a9a',border:'rgba(105,105,105,.3)',bg:'rgba(100,100,100,.16)'},
    lt3:{color:'#c07838',border:'rgba(160,100,40,.35)',bg:'rgba(160,100,40,.14)'},
    ht3:{color:'#e8b870',border:'rgba(220,160,80,.38)',bg:'rgba(220,160,80,.14)'},
    lt2:{color:'#c0c0d8',border:'rgba(160,160,200,.35)',bg:'rgba(160,160,200,.12)'},
    ht2:{color:'#e8e8f8',border:'rgba(220,220,240,.38)',bg:'rgba(220,220,240,.12)'},
    lt1:{color:'#ffd700',border:'rgba(255,215,0,.4)',bg:'rgba(255,215,0,.12)'},
    ht1:{color:'#fff8a0',border:'rgba(255,248,120,.45)',bg:'rgba(255,248,120,.12)'},
  };
  const activeTiers=TIER_ORDER.filter(t=>colData[t].length>0);
  const cols=activeTiers.map(t=>{
    const h=HDR[t];
    const players=colData[t].map(p=>`<div class="col-player" title="${esc(p.ign)} — ${p.overall}pts">${esc(p.ign)}</div>`).join('');
    return`<div class="tier-col">
      <div class="tier-col-hdr" style="color:${h.color};border-color:${h.border};background:${h.bg}">${t.toUpperCase()}</div>
      <div class="tier-col-body">${players||'<div class="col-empty">—</div>'}</div>
    </div>`;
  }).join('');
  el.innerHTML=`<div class="col-wrap"><div class="tier-columns">${cols}</div></div>`;
}

function renderSearch(){
  const el=document.getElementById('content');
  const q=searchVal.toLowerCase();
  const exact=allPlayers.filter(p=>p.ign.toLowerCase()===q);
  const fuzzy=allPlayers.filter(p=>p.ign.toLowerCase().includes(q)&&!exact.includes(p)).sort((a,b)=>b.overall-a.overall);
  const profiles=[...exact,...fuzzy].slice(0,5);
  if(!profiles.length){el.innerHTML='<div class="empty"><b>No players found</b>Try a different name.</div>';return;}
  el.innerHTML=profiles.map(p=>{
    const t=getTitle(p.overall);
    const bodyUrl=skinUrl(p.ign,'body');
    const kitRows=KITS.filter(k=>p.kits[k]).map(k=>{
      const tier=p.kits[k], pts=TIER_SCORES[tier]||0;
      return`<div class="profile-kit-row">
        <div class="profile-kit-left">${KIT_ICONS[k]} <span>${KIT_LABELS[k]}</span> ${tierBadge(tier)}</div>
        <span class="profile-kit-pts">+${pts} pts</span>
      </div>`;
    }).join('');
    return`<div class="profile-card">
      <div class="profile-top">
        <div class="profile-skin">
          <img class="profile-body-img" src="${bodyUrl}" alt="${esc(p.ign)}" onerror="this.style.display='none'">
        </div>
        <div class="profile-info">
          <div class="profile-ign">${esc(p.ign)}</div>
          <div style="margin-bottom:4px;">${titleBadge(p.overall)}</div>
        </div>
        <div class="profile-right">
          <div class="profile-pts">${p.overall}</div>
          <div class="profile-pts-label">points</div>
        </div>
      </div>
      <div class="profile-kits">${kitRows||'<span style="color:var(--muted);font-size:.82rem;">No kits evaluated yet.</span>'}</div>
    </div>`;
  }).join('');
}

document.getElementById('search').addEventListener('input',e=>{
  searchVal=e.target.value.trim();
  document.getElementById('section-label').textContent=
    searchVal.length>=2?'Player Search':
    activeKit==='overall'?'Overall ranking — Top 50':`${KIT_LABELS[activeKit]||activeKit} — Tier Columns`;
  render();
});

setInterval(loadPlayers,60000);
loadPlayers();
</script>
</body>
</html>
